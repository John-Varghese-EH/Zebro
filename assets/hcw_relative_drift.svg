<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="curveSafe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="420" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Clohessy-Wiltshire (Hill) Relative-Motion Optimization</text>
    <text x="0" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Why burning 1.5 to 3.0 orbits early in along-track saves up to 98% fuel compared to late emergency dodges</text>
  </g>

  <!-- Left Side: Mathematical Physics Concept (RTN Frame) -->
  <g transform="translate(60, 110)">
    <!-- Local RTN Coordinate Frame Box -->
    <rect x="0" y="0" width="380" height="260" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Local Orbit-Relative Frame (RTN)</text>
    
    <!-- Axes Drawing -->
    <g transform="translate(190, 140)">
      <!-- Radial Axis (+R Up) -->
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#94A3B8" stroke-width="1.5" />
      <polygon points="0,-95 -4,-85 4,-85" fill="#94A3B8" />
      <text x="8" y="-85" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="700">+R (Radial)</text>

      <!-- Along-Track Axis (+T Right, Along Velocity) -->
      <line x1="0" y1="0" x2="140" y2="0" stroke="#38BDF8" stroke-width="2" />
      <polygon points="145,0 135,-4 135,4" fill="#38BDF8" />
      <text x="90" y="-10" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">+T (Velocity)</text>

      <!-- Center Satellite Position -->
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2" />
      <text x="-85" y="20" fill="#CBD5E1" font-family="monospace" font-size="10">Spacecraft (m0)</text>

      <!-- Secular Drift Vector -->
      <path d="M 10 10 Q 70 40 120 75" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="120" cy="75" r="4" fill="#10B981" />
      <text x="35" y="80" fill="#10B981" font-family="monospace" font-size="9" font-weight="700">Secular Drift: -3·Δv_T·τ</text>
    </g>

    <!-- Formula snippet below -->
    <rect x="15" y="215" width="350" height="32" rx="6" fill="#030712" stroke="#334155" stroke-width="0.8" />
    <text x="25" y="235" fill="#38BDF8" font-family="monospace" font-size="11">T(τ) = -3nτ·Δv_T  (Differential Period Accumulation)</text>
  </g>

  <!-- Right Side: Δv Consumption Curve vs Lead Time -->
  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="560" height="260" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="25" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Delta-v Requirement for 5.0 km Safe Clearance</text>

    <!-- Graph Axes -->
    <g transform="translate(60, 45)">
      <!-- Y-Axis (Delta-v in m/s) -->
      <line x1="0" y1="0" x2="0" y2="160" stroke="#475569" stroke-width="1" />
      <text x="-45" y="10" fill="#94A3B8" font-family="monospace" font-size="9">8.0 m/s</text>
      <text x="-45" y="55" fill="#94A3B8" font-family="monospace" font-size="9">5.0 m/s</text>
      <text x="-45" y="110" fill="#94A3B8" font-family="monospace" font-size="9">2.0 m/s</text>
      <text x="-45" y="155" fill="#94A3B8" font-family="monospace" font-size="9">0.0 m/s</text>

      <!-- X-Axis (Lead Time in Orbits before TCA) -->
      <line x1="0" y1="160" x2="450" y2="160" stroke="#475569" stroke-width="1" />
      <text x="25" y="180" fill="#94A3B8" font-family="monospace" font-size="10">0.25 Orbits</text>
      <text x="135" y="180" fill="#94A3B8" font-family="monospace" font-size="10">1.0 Orbits</text>
      <text x="255" y="180" fill="#94A3B8" font-family="monospace" font-size="10">2.0 Orbits</text>
      <text x="375" y="180" fill="#94A3B8" font-family="monospace" font-size="10">3.0 Orbits (Lead)</text>

      <!-- Grid lines -->
      <line x1="0" y1="50" x2="450" y2="50" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3" />
      <line x1="0" y1="105" x2="450" y2="105" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3" />

      <!-- Curve Plot: steep decline from 7.8 m/s down to 0.16 m/s -->
      <path d="M 25 10 C 60 40, 100 120, 160 142 C 220 152, 320 156, 420 157 L 420 160 L 25 160 Z" fill="url(#areaFill)" />
      <path d="M 25 10 C 60 40, 100 120, 160 142 C 220 152, 320 156, 420 157" fill="none" stroke="url(#curveSafe)" stroke-width="3" />

      <!-- High-Cost Marker (Late dodge) -->
      <circle cx="25" cy="10" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />
      <rect x="35" y="2" width="130" height="22" rx="4" fill="#1E0E14" stroke="#EF4444" stroke-width="0.8" />
      <text x="42" y="16" fill="#FCA5A5" font-family="monospace" font-size="9" font-weight="700">0.25 orb: Δv = 7.7 m/s</text>

      <!-- Optimal Zebro Marker (Early along-track) -->
      <circle cx="255" cy="154" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
      <rect x="235" y="112" width="165" height="28" rx="4" fill="#042F2E" stroke="#10B981" stroke-width="0.8" />
      <text x="242" y="125" fill="#6EE7B7" font-family="monospace" font-size="9" font-weight="700">Zebro Plan (2.0 orbits):</text>
      <text x="242" y="136" fill="#A7F3D0" font-family="monospace" font-size="8">Δv = 0.16 m/s (98% saved)</text>
    </g>
  </g>
</svg>
