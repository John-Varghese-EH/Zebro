<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="orbitSat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="orbitDeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="480" fill="url(#bgGlow)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Editorial Header -->
  <g transform="translate(80, 110)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="0.8" opacity="0.8" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <text x="26" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ASTRA 2026 : PS-06 SUSTAINABLE SPACE</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Every dodge costs fuel.</text>
    <text x="0" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="400" letter-spacing="-1">Zebro makes each one count.</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Autonomous orbital traffic control, Clohessy-Wiltshire fuel-saving maneuvers,</text>
    <text x="0" y="188" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">and statutory compliance with India's DFSM-2030 de-orbit directive.</text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#64748B" font-family="monospace" font-size="9" font-weight="600">PROPULSION SAVINGS</text>
      <text x="14" y="38" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">98% Δv Saved</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="155" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="169" y="20" fill="#64748B" font-family="monospace" font-size="9" font-weight="600">HORIZON SCREENING</text>
      <text x="169" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">72-Hour SGP4</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="145" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="334" y="20" fill="#64748B" font-family="monospace" font-size="9" font-weight="600">POLICY ALIGNMENT</text>
      <text x="334" y="38" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">DFSM-2030</text>
    </g>
  </g>

  <!-- Right Visual: 3D Earth, Orbit Tracks, and Spacecraft Interaction -->
  <g transform="translate(930, 240)">
    <!-- Earth Outer Atmosphere Glow -->
    <circle cx="0" cy="0" r="150" fill="url(#earthGlow)" />
    
    <!-- Earth Globe -->
    <circle cx="0" cy="0" r="110" fill="#091424" stroke="#1E3A5F" stroke-width="1.5" />
    <!-- Latitude / Longitude Curvature -->
    <ellipse cx="0" cy="0" rx="110" ry="42" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="58" ry="110" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="109" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
    
    <!-- Debris Orbit Track (Red) -->
    <ellipse cx="0" cy="0" rx="175" ry="68" fill="none" stroke="url(#orbitDeb)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(45)" opacity="0.8" />
    
    <!-- Satellite Avoidance Trajectory (Green / Cyan) -->
    <ellipse cx="0" cy="0" rx="160" ry="72" fill="none" stroke="url(#orbitSat)" stroke-width="2.5" transform="rotate(-20)" filter="url(#glow)" />

    <!-- Satellite Marker (NISAR) -->
    <g transform="translate(-115, -45)">
      <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.2" className="animate-ping" />
      <circle cx="0" cy="0" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glow)" />
      <!-- Label Box -->
      <rect x="12" y="-12" width="110" height="24" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="0.8" opacity="0.9" />
      <text x="18" y="4" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="700">NISAR (747 km)</text>
    </g>

    <!-- Debris Marker (Fengyun-1C) -->
    <g transform="translate(90, 85)">
      <circle cx="0" cy="0" r="4" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1" />
      <!-- Label Box -->
      <rect x="10" y="-10" width="120" height="20" rx="4" fill="#0B132B" stroke="#F43F5E" stroke-width="0.8" opacity="0.9" />
      <text x="16" y="4" fill="#FDA4AF" font-family="monospace" font-size="8">FENGYUN-1C DEB</text>
    </g>

    <!-- Encounter Vector Indicator -->
    <line x1="-115" y1="-45" x2="-80" y2="-15" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="-80" cy="-15" r="3" fill="#F43F5E" />
    <text x="-70" y="-12" fill="#F43F5E" font-family="monospace" font-size="8" font-weight="700">TCA: 150m (CLEARED)</text>
  </g>
</svg>
